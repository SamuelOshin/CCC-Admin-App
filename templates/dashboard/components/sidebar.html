{% load static %}
<div class="sidebar" id="dashboard-sidebar">
    <!-- Sidebar Header -->
    <div class="sidebar-header p-3 border-bottom" style="border-color: rgba(255,255,255,0.1) !important;">
        <div class="d-flex align-items-center">
            <div class="sidebar-brand-icon me-3">
                <img src="{% static 'assets/img/777899999.png' %}" alt="CCC Logo" 
                     class="img-fluid" width="50" height="50" style="transform: rotate(18deg);">
            </div>
            <div class="sidebar-brand-text">
                <div class="fw-bold" style="color: #ffffff; font-size: 16px;">CCC Admin App</div>
                <small style="color: rgba(255,255,255,0.7);">{{ current_module.name|default:"Dashboard" }}</small>
            </div>
            <button class="btn btn-sm text-white ms-auto d-md-none" id="mobileToggle">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

<style>
/* Modern Sidebar Styles */
.sidebar {
    min-height: 100vh;
    background: linear-gradient(180deg, #5a5c69 10%, #2e59d9 100%);
    box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
}

.sidebar .nav-link {
    color: rgba(255, 255, 255, 0.8);
    padding: 1rem;
    font-weight: 400;
    transition: all 0.15s ease-in-out;
}

.sidebar .nav-link:hover,
.sidebar .nav-link.active {
    color: #fff;
    background-color: rgba(255, 255, 255, 0.1);
}

.sidebar .nav-link i {
    font-size: 0.85rem;
    margin-right: 0.25rem;
}

.sidebar .sidebar-brand {
    height: 4.375rem;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 800;
    padding: 1.5rem 1rem;
    text-align: center;
    color: #fff;
    background-color: rgba(0, 0, 0, 0.1);
}

.sidebar .sidebar-brand .sidebar-brand-icon i {
    font-size: 2rem;
}

.sidebar .sidebar-brand .sidebar-brand-text {
    display: inline;
}

.sidebar hr.sidebar-divider {
    margin: 0 1rem 1rem;
    border-color: rgba(255, 255, 255, 0.15);
}

.sidebar .sidebar-heading {
    text-align: center;
    padding: 0 1rem;
    font-weight: 800;
    font-size: 0.65rem;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.05rem;
}

/* Collapse Styles */
.sidebar .collapse-inner {
    border-radius: 0.35rem;
    box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
}

.sidebar .collapse-item {
    display: block;
    color: #3a3b45;
    text-decoration: none;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    white-space: nowrap;
    transition: all 0.15s ease-in-out;
}

.sidebar .collapse-item:hover,
.sidebar .collapse-item.active {
    background-color: #eaecf4;
    color: #5a5c69;
}

.sidebar .collapse-header {
    margin: 0;
    color: #6c757d;
    font-weight: 800;
    font-size: 0.65rem;
    text-transform: uppercase;
    padding: 1.5rem 1rem 0.5rem;
}

/* Sidebar Toggler */
.sidebar #sidebarToggle {
    width: 2.5rem;
    height: 2.5rem;
    text-align: center;
    margin-bottom: 1rem;
    cursor: pointer;
    background-color: rgba(255, 255, 255, 0.2);
    color: rgba(255, 255, 255, 0.5);
    transition: all 0.15s ease-in-out;
}

.sidebar #sidebarToggle:hover {
    background-color: rgba(255, 255, 255, 0.25);
    color: rgba(255, 255, 255, 0.75);
}

.sidebar #sidebarToggle:focus {
    outline: none;
}

/* User Card */
.sidebar .sidebar-card {
    flex: 1 0 auto;
    padding: 1rem;
    position: relative;
}

.sidebar .sidebar-card .card {
    border: none;
    background-color: rgba(0, 0, 0, 0.1);
    border-radius: 0.35rem;
}

.sidebar .sidebar-card .card-body {
    padding: 0.75rem 1rem;
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.7rem;
    line-height: 1.5;
}

/* Mobile Responsive */
@media (max-width: 767.98px) {
    .sidebar {
        width: 100%;
        position: fixed;
        top: 0;
        left: -100%;
        z-index: 1050;
        transition: all 0.3s ease-in-out;
    }
    
    .sidebar.show {
        left: 0;
    }
    
    .sidebar .sidebar-card {
        display: none !important;
    }
}

/* Sidebar Collapsed State */
.sidebar.toggled {
    width: 6.5rem;
}

.sidebar.toggled .sidebar-brand .sidebar-brand-text {
    display: none;
}

.sidebar.toggled .sidebar-heading {
    display: none;
}

.sidebar.toggled .nav-link span {
    display: none;
}

.sidebar.toggled .sidebar-card {
    display: none !important;
}

.sidebar.toggled .collapse {
    display: none;
}

.sidebar.toggled .nav-link {
    text-align: center;
    padding: 0.75rem 1rem;
    width: 6.5rem;
}

.sidebar.toggled .nav-link i {
    margin-right: 0;
}
</style>
